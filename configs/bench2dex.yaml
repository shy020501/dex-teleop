# Linux server profile. Windows receives control settings when it connects.
simulator: bench2dex

network:
  bind: tcp://127.0.0.1:5557
  timeout_s: 0.25
  challenge_ttl_s: 0.25
  client_hz: 60
control:
  enabled_sides: [right, left]
  home_key_enabled: false
  keyboard_speed_m_s: 0.04
  max_position_speed_m_s: 0.06
  max_arm_joint_speed_rad_s: 0.8
  max_finger_joint_speed_rad_s: 3.0
  tracking_timeout_s: 0.2
  workspace_radius_xyz: [0.35, 0.35, 0.15]
  workspace_lower_radius_xyz: [0.35, 0.15, 0.50]
  max_ik_position_error_m: 0.08
  max_ik_orientation_error_rad: 0.15
  status_path: logs/teleop/status.json
haptics:
  enabled: true
  force_on_n: 0.15
  force_off_n: 0.08
  full_force_n: 3.0
  max_power: 0.35
  attack_tau_s: 0.04
  minimum_pulse_s: 0.06
