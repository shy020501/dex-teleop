# Shared browser/recording main RGB 1280x720 + two wrist RGB cameras 320x240.
dataset:
  root: ../../logs/dashboard-staging
  name: ui
capture:
  fps: 20
  step_stride: 3
  max_buffer_mb: 6144
modalities:
  rgb: true
  depth: false
  joint_state: true
  object_pose: true
  box3d: false
  box2d: false
  tactile: false
camera_list:
- id: cam_task
  mount_type: world
  position:
  - 0.0
  - -0.65
  - 2.0
  target:
  - 0.0
  - 0.25
  - 0.82
  width: 1280
  height: 720
  # Match the previous browser viewport's horizontal field of view.
  focal_length: 18.147562
  horizontal_aperture: 20.955
  clipping_range:
  - 0.01
  - 20.0
- id: cam_wrist_right
  mount_type: robot_link
  camera_type: fisheye
  fisheye_camera_matrix:
  - - 84.8528
    - 0.0
    - 160.0
  - - 0.0
    - 84.8528
    - 120.0
  - - 0.0
    - 0.0
    - 1.0
  fisheye_distortion_coefficients:
  - -0.0416667
  - 0.0005208
  - -3.1e-06
  - 1.08e-08
  fisheye_max_fov_deg: 180.0
  parent_link: wrist_3_link
  offset_xyz:
  - 0.052620712
  - 0.057382115
  - 0.075768
  offset_rpy:
  - -0.26275
  - 0.084286
  - 1.54736
  width: 320
  height: 240
  clipping_range:
  - 0.01
  - 5.0
- id: cam_wrist_left
  mount_type: robot_link
  camera_type: fisheye
  fisheye_camera_matrix:
  - - 84.8528
    - 0.0
    - 160.0
  - - 0.0
    - 84.8528
    - 120.0
  - - 0.0
    - 0.0
    - 1.0
  fisheye_distortion_coefficients:
  - -0.0416667
  - 0.0005208
  - -3.1e-06
  - 1.08e-08
  fisheye_max_fov_deg: 180.0
  parent_link: L_arm_wrist_3_link
  offset_xyz:
  - -0.052529389
  - 0.057465743
  - 0.075768174
  offset_rpy:
  - 0.261799551
  - 7.1e-08
  - 1.569999956
  width: 320
  height: 240
  clipping_range:
  - 0.01
  - 5.0
scene_background:
  enabled: false
