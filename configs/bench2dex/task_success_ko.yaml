# 사용자용 성공 조건 안내. 판정은 Bench2Dex/scenes/{task}.yaml의
# metrics.terminal.raw_condition과 그 조건이 호출하는 success/custom 코드를 따른다.
# stages는 진행도 지표이며, terminal에 없는 동작을 필수 성공 조건으로 추가하지 않는다.
# 유지 시간은 UI/API에서 각 scene의 terminal.dwell_time_s를 직접 읽는다.
version: 1
notes:
  - 위치 판정은 물체 기준점과 보정된 중심·영역을 사용한다. 물체 전체가 용기에 들어갔는지 정밀 충돌 검사하는 방식은 아니다.
  - 붓기·국 뜨기·물 받기는 물체 자세와 이동 순서로 판정하며, 실제 액체의 양을 측정하지 않는다.
  - 순서 완료를 기억하는 task는 완료 이후 성공 판정이 유지된다. 유지 시간은 시뮬레이션 시간 기준이다.
tasks:
  03_wine_glass_plate_balance:
    summary: 와인잔 3개를 각각 다른 목표 위치에 똑바로 세우고 멈추세요.
    details:
      - "목표 XY(m): (0.58, 0.25), (0.08, 0.25), (-0.42, 0.25). 각 목표에서 10cm 이내이며 잔의 순서는 자유입니다."
      - 잔의 기울기는 30° 미만, 선속도 5cm/s·각속도 0.25rad/s 미만이어야 합니다.
      - 접시 위치나 접시 위 균형은 최종 성공 조건에 포함되지 않습니다.
  06_fruit_bowl_loading:
    summary: 바나나 1개와 사과 2개를 그릇에 모으고, 그릇과 과일을 멈추세요.
    details:
      - "그릇은 월드 X -0.5~0.5m, Y -0.3~0.3m, Z 0.70~0.85m 영역에 놓고 기울기를 30° 미만으로 유지합니다."
      - 각 과일의 보정 중심은 그릇 중심에서 수평 12.5cm 미만이며, 그릇 중심보다 5cm 넘게 낮으면 안 됩니다.
      - 그릇과 세 과일의 선속도가 모두 5cm/s 미만이어야 합니다.
  07_citrus_plate_loading:
    summary: 레몬 2개와 오렌지 2개를 접시 위에 모으고 멈추세요.
    details:
      - 과일의 보정 중심이 접시 중심에서 수평 15cm 미만, 높이는 접시 중심보다 5cm 넘게 낮지 않아야 합니다.
      - 접시의 기울기는 30° 미만, 과일 네 개의 선속도는 각각 5cm/s 미만이어야 합니다.
  08_frypan_stand_pour:
    summary: 팬을 스토브에 놓고 간장 → 올리브유 순서로 부은 뒤, 두 병을 테이블에 세우세요.
    details:
      - 팬 중심을 스토브의 판정 목표점에서 수평 10cm 미만으로 맞춘 뒤, 간장병과 기름병을 차례대로 50° 이상 기울입니다.
      - 붓는 병의 입구가 팬 중심에서 수평 12.5cm 미만이어야 합니다. 액체량 대신 자세와 위치로 판정합니다.
      - 마지막에는 두 병의 기울기 15° 미만·선속도 5cm/s 미만·높이 스토브 기준 +5cm 미만이며, 빵은 팬 중심에서 수평 12.5cm 미만이어야 합니다.
  09_cleaner_moisturizer_box_loading:
    summary: 세정제와 비누를 나무 상자에 넣고 멈추세요.
    details:
      - 두 물체의 보정 중심이 상자 중심에서 수평 18cm 미만이며, 상자 중심보다 5cm 넘게 낮으면 안 됩니다.
      - 상자와 세정제의 기울기는 각각 30° 미만이어야 합니다. 비누의 방향은 검사하지 않습니다.
      - 두 물체의 선속도가 각각 5cm/s 미만이어야 합니다.
  12_screwdriver_box_and_hammer:
    summary: 드라이버 2개를 상자에 넣은 뒤 망치로 나무 블록을 한 번 치고, 망치도 상자에 넣으세요.
    details:
      - 두 드라이버가 상자에 들어간 뒤의 타격만 인정합니다. 블록 근처에서 망치를 휘두르고 블록에도 움직임이 생겨야 합니다.
      - "타격 기준: 수평 거리 28cm 미만·망치 속도 25cm/s 초과. 블록의 선속도 2.5cm/s 또는 각속도 0.15rad/s 초과 반응이 1초 이내에 있어야 합니다."
      - 마지막에는 세 도구 모두 상자 중심에서 수평 18cm 미만·선속도 5cm/s 미만이며, 상자는 30° 미만으로 세워져 있어야 합니다.
      - 상자를 왼쪽으로 이동하는 동작 자체는 최종 성공 조건에 포함되지 않습니다.
  21_condiment_box_loading:
    summary: 간장·식초·조미료를 나무 상자에 넣고, 두 병을 세운 상태로 멈추세요.
    details:
      - 각 물체의 보정 중심이 상자 중심에서 수평 18cm 미만이며, 상자 중심보다 5cm 넘게 낮으면 안 됩니다.
      - 상자·간장병·식초병의 기울기는 30° 미만이어야 합니다. 조미료 봉지는 누워 있어도 됩니다.
      - 세 물체의 선속도가 각각 5cm/s 미만이어야 합니다.
  22_tool_box_loading:
    summary: 십자·일자 드라이버, 렌치, 드릴을 모두 나무 상자에 넣고 멈추세요.
    details:
      - 네 도구의 보정 중심이 상자 중심에서 수평 18cm 미만이며, 상자 중심보다 5cm 넘게 낮으면 안 됩니다.
      - 상자의 기울기는 30° 미만, 각 도구의 선속도는 5cm/s 미만이어야 합니다.
  24_stationery_category_sorting:
    summary: 펜·마커는 펜꽂이에, 풀·배터리는 플라스틱 상자에 넣으세요.
    details:
      - 각 물체의 기준점이 해당 용기의 지정 내부 영역에 있어야 하며, 두 용기의 기울기는 30° 미만이어야 합니다.
      - 펜과 마커의 긴 축은 위쪽으로 60° 미만 기울여 세웁니다. 풀과 배터리의 방향은 자유입니다.
      - 네 물체의 선속도가 각각 5cm/s 미만이어야 합니다.
  26_canned_food_tray_line_arrangement:
    summary: 캔·조미료·우유팩·고기 통조림을 트레이 위에 세워 놓고 멈추세요.
    details:
      - 각 물체의 보정 중심은 트레이 중심에서 수평 18cm 미만, 높이는 트레이 중심보다 0~15cm 위에 있어야 합니다.
      - 물체의 기울기는 25° 미만, 트레이는 30° 미만이며, 네 물체의 선속도는 각각 5cm/s 미만이어야 합니다.
      - 일렬 정렬이나 물체 간 간격은 별도로 검사하지 않습니다.
  27_ball_box_loading:
    summary: 축구공·테니스공·골프공·탁구공을 모두 바구니에 넣고 멈추세요.
    details:
      - 각 공의 보정 중심이 바구니 중심에서 수평 22cm 미만이며, 바구니 중심보다 5cm 넘게 낮으면 안 됩니다.
      - 바구니의 기울기는 30° 미만, 네 공의 선속도는 각각 5cm/s 미만이어야 합니다.
  32_baking_tray_prep_with_tools:
    summary: 푸딩 상자·젤라틴 상자·뒤집개·브러시를 트레이 위에 올리고 멈추세요.
    details:
      - 각 물체의 보정 중심은 트레이 중심에서 수평 22cm 미만, 높이는 트레이 중심보다 0~18cm 위에 있어야 합니다.
      - 트레이의 기울기는 30° 미만, 네 물체의 선속도는 각각 5cm/s 미만이어야 합니다.
  34_fridge_wine_interhand_pour:
    summary: 냉장고 열기 → 와인병 들어 올리기 → 잔 쪽으로 붓기 → 병을 냉장고에 넣기 → 문 닫기 순서로 진행하세요.
    details:
      - "문 관절은 |q| > 1.22rad까지 열고, 병은 월드 Z > 0.82m로 들어 올립니다."
      - 병을 50° 이상 기울이고 잔에서 수평 35cm 이내에서 잔 쪽을 향하게 합니다. 실제 액체량은 검사하지 않습니다.
      - 병을 냉장고의 지정 영역에 60° 이하로 세워 돌려놓은 뒤, 문을 |q| < 0.25rad로 닫습니다.
      - 양손 사이의 전달 여부나 어느 손을 사용했는지는 최종 판정에서 직접 검사하지 않습니다.
  42_trash_disposal:
    summary: 바나나 껍질·종이·병을 쓰레기통에 모으고 멈추세요.
    details:
      - 세 물체의 기준점이 쓰레기통 중심에서 수평 25cm 미만이어야 합니다.
      - 쓰레기통의 기울기는 30° 미만, 각 물체의 선속도는 5cm/s 미만이어야 합니다.
      - 현재 판정은 높이 제한이 매우 느슨하므로, 쓰레기통 안에 완전히 들어갔는지를 정밀하게 검사하지 않습니다.
  43_fridge_fruit_shelf_sorting:
    summary: 바나나와 사과를 냉장고 내부에 넣고, 양쪽 문을 모두 닫으세요.
    details:
      - 두 과일의 보정 중심이 냉장고의 지정 내부 영역에 있고 선속도가 각각 5cm/s 미만이어야 합니다.
      - "문 관절 joint_0와 joint_1이 모두 |q| < 0.1rad여야 합니다."
      - 최종 판정은 두 과일이 내부에 있는지를 검사하며, 서로 다른 선반에 나누는 조건은 없습니다.
  44_microwave_bowl_loading:
    summary: 바게트를 그릇에 담아 전자레인지 안에 넣고 문을 닫으세요.
    details:
      - 그릇과 바게트가 모두 전자레인지의 지정 내부 영역에 있어야 합니다.
      - 그릇의 기울기는 30° 미만, 바게트는 그릇 중심에서 수평 12.5cm 미만이며, 두 물체의 선속도는 각각 5cm/s 미만이어야 합니다.
      - "전자레인지 문 관절 joint_0를 |q| < 0.2rad로 닫습니다."
  51_toilet_lid_cleaner_pour:
    summary: 변기 뚜껑을 열고 세정제를 변기 쪽으로 기울여 부은 뒤, 뚜껑을 닫으세요.
    details:
      - "뚜껑 관절 q > 0.2인 상태에서 세정제를 월드 Z ≥ 0.75m, 변기와 수평 거리 45cm 미만으로 가져갑니다."
      - 병을 변기 방향으로 50° 이상 기울여야 하며, 붓는 동안 뚜껑이 열려 있어야 합니다.
      - 마지막에는 뚜껑 관절을 -1.0에서 오차 0.1 미만으로 닫습니다. 붓기는 액체량 대신 병의 자세로 판정합니다.
  60_breadbasket_fast_food_loading:
    summary: 감자튀김·햄버거·빵·바게트를 모두 빵 바구니에 넣고 멈추세요.
    details:
      - 각 음식의 보정 중심이 바구니 중심에서 수평 18cm 미만이며, 바구니 중심보다 5cm 넘게 낮으면 안 됩니다.
      - 바구니의 기울기는 30° 미만, 네 음식의 선속도는 각각 5cm/s 미만이어야 합니다.
  61_medicine_shoebox_pack:
    summary: 약병·치약·보습 오일을 신발 상자에 넣고 멈추세요.
    details:
      - 세 물체의 기준점이 상자 좌표계의 지정 내부 영역에 있어야 합니다.
      - 상자의 기울기는 30° 미만, 각 물체의 선속도는 5cm/s 미만이어야 합니다. 물체 자체를 세우는 조건은 없습니다.
  62_shoebox_accessory_pack:
    summary: 도장·신발·반려동물 목줄을 신발 상자에 넣고 멈추세요.
    details:
      - 세 물체의 기준점이 상자 좌표계의 지정 내부 영역에 있어야 합니다.
      - 상자의 기울기는 30° 미만, 각 물체의 선속도는 5cm/s 미만이어야 합니다. 물체 자체의 방향은 자유입니다.
  64_sports_ball_cup_sort:
    summary: 소프트볼·야구공은 D 컵에, 라켓볼·골프공은 E 컵에 넣으세요.
    details:
      - 각 공의 보정 중심이 지정된 컵 중심에서 수평 15cm 미만이며, 컵 중심보다 5cm 넘게 낮으면 안 됩니다.
      - 두 컵의 기울기는 30° 미만, 네 공의 선속도는 각각 5cm/s 미만이어야 합니다.
  67_faucet_cup_water_fill:
    summary: 숟가락 넣기 → 컵을 수도꼭지 아래로 이동 → 수도 열고 닫기 → 컵을 트레이에 놓기 순서로 진행하세요.
    details:
      - 숟가락은 컵에서 3D 거리 18cm 미만이며, 긴 축을 위로 65° 미만 기울여 세웁니다.
      - "컵을 월드 XY (0.01, -0.04)m에서 6.3cm 이내에 놓은 뒤 수도 관절을 q ≥ 1.0으로 열고 q < 0.52로 닫습니다. 여닫는 동안 컵이 계속 이 영역에 있어야 합니다."
      - 마지막에 숟가락이 컵에 남아 있고, 컵은 트레이 중심에서 수평 20cm 미만·높이 0~3.5cm 위·선속도 5cm/s 미만이어야 합니다.
      - 실제 물의 양이나 사용한 손은 검사하지 않습니다.
  73_jigsaw_puzzle_assembly:
    summary: 조각 2·3·4·5를 고정된 흰 조각 1 주변의 완성 위치에 맞추고 멈추세요.
    details:
      - "목표 XY(m): 2=(-0.065, 0.300), 3=(-0.150, 0.270), 4=(-0.150, 0.190), 5=(-0.065, 0.215)."
      - 각 조각의 수평 오차는 2cm 이하, 고정 조각과의 높이 차이는 1cm 이하여야 합니다.
      - 조각 1~5 모두 선속도 6cm/s·각속도 0.5rad/s 미만이어야 합니다. 조각의 회전각 자체는 별도로 검사하지 않습니다.
  76_soup_serving:
    summary: 국자를 냄비에서 그릇 위로 두 번 옮긴 뒤 냄비에 돌려놓고, 그릇을 서빙 구역에 세워 놓으세요.
    details:
      - 국자 머리가 냄비 영역에 들어간 뒤 그릇 중심에서 수평 15cm 미만·그릇보다 2cm 넘게 위로 이동하는 동작을 두 번 수행합니다.
      - "마지막 그릇 위치(m): X -0.56~-0.38, Y 0.20~0.42, Z 0.68~0.85. 기울기는 30° 미만이어야 합니다."
      - 마지막에 국자 머리는 냄비 영역에 있어야 합니다. 실제 국물의 양은 검사하지 않습니다.
  79_bimanual_piano_melody:
    summary: 피아노의 왼쪽·오른쪽 건반 시퀀스를 각각 끝까지 누르세요.
    details:
      - "왼쪽 건반 번호: 18 → 18 → 23 → 23 → 24 → 24 → 23."
      - "오른쪽 건반 번호: 33 → 33 → 38 → 38 → 39 → 39 → 38."
      - 건반 관절이 0.004를 넘으면 눌림, 0.002 미만이면 놓음으로 판정합니다. 반복 음은 놓았다 다시 눌러야 합니다.
      - 두 시퀀스는 독립적으로 진행하며, 다른 음을 눌러도 진행도가 초기화되지 않습니다. 어느 손으로 눌렀는지는 검사하지 않습니다.
  80_gaming_desk_setup:
    summary: 모니터를 바르게 놓기 → 시뮬레이션 속 ESC 키 누르고 놓기 → 마우스 왼쪽 버튼 누르고 놓기 순서로 진행하세요.
    details:
      - 모니터는 월드 Y < 0.282m, 수직·가로 정렬 오차 각각 5° 미만이며, 선속도 6cm/s·각속도 0.5rad/s 미만이어야 합니다.
      - "ESC 관절 joint_100: |q| > 0.005까지 누른 뒤 |q| < 0.001로 놓습니다."
      - "마우스는 Y < 키보드 Y + 0.015m에 두고, 버튼 joint_0를 |q| > 0.0075까지 누른 뒤 |q| < 0.001로 놓습니다."
  86_short_jigsaw_puzzle:
    summary: 조각 2·3만 고정된 흰 조각 1 옆의 완성 위치에 맞추고 멈추세요.
    details:
      - "목표 XY(m): 2=(-0.065, 0.300), 3=(-0.150, 0.270). 수평 오차는 각각 2cm 이하여야 합니다."
      - 고정 조각과의 높이 차이는 1cm 이하, 조각 2·3의 선속도는 각각 10cm/s 미만이어야 합니다.
      - 조각 4·5와 조각의 회전각·각속도는 성공 조건에 포함되지 않습니다.
