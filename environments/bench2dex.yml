# Bench2Dex / Isaac Sim on Linux x86_64. Finish with scripts/setup_bench2dex.sh.
# The separate pip step handles CUDA wheels, flatdict and editable Isaac Lab in order.
name: bench2dex
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.11
  - pip>=24,<27
  - setuptools=80.9.0
  - wheel=0.45.1
  - packaging=23.0

